# 项目相关配置
ruoyi:
  # 名称
  name: API
  # 版本
  version: 3.8.6
  # 版权年份
  copyrightYear: 2023
  # 实例演示开关
  demoEnabled: true
  # 文件路径 示例（ Windows配置D:/ruoyi/uploadPath，Linux配置 /home/ruoyi/uploadPath或var/ruoyi/uploadPath）
  profile: var/ruoyi/uploadPath
  # 获取ip地址开关
  addressEnabled: false
  # 验证码类型 math 数字计算 char 字符验证
  captchaType: math

# 开发环境配置
server:
  # 服务器的HTTP端口，默认为8080
  port: 8888
  # HTTPS
  ssl:
    key-store: classpath:yiti.shunxuan.net.cn.jks
    key-store-password: 4c1c4h4x
    key-store-type: JKS
    #certificate: yiti.shunxuan.net.cn.pem
    #certificate-private-key: yiti.shunxuan.net.cn.key
    enabled: true
    enabled-protocols: TLSv1.2,TLSv1.3
    ciphers: ECDHE-RSA-AES128-GCM-SHA256:ECDHE:ECDH:AES:HIGH:!NULL:!aNULL:!MD5:!ADH:!RC4:!DH:!DHE

  servlet:
    # 应用的访问路径
    context-path: /
  tomcat:
    # tomcat的URI编码
    uri-encoding: UTF-8
    # 连接数满后的排队数，默认为100
    accept-count: 1000
    threads:
      # tomcat最大线程数，默认为200
      max: 800
      # Tomcat启动初始化的线程数，默认值10
      min-spare: 100

# 日志配置
logging:
  level:
    com.ruoyi: debug
    org.springframework: warn

# 用户配置
user:
  password:
    # 密码最大错误次数
    maxRetryCount: 5
    # 密码锁定时间（默认10分钟）
    lockTime: 10

# Spring配置
spring:
  # 资源信息
  messages:
    # 国际化资源文件路径
    basename: i18n/messages
  profiles:
    active: druid
  # 文件上传
  servlet:
    multipart:
      # 单个文件大小
      max-file-size: 10MB
      # 设置总上传的文件大小
      max-request-size: 20MB
  # 服务模块
  devtools:
    restart:
      # 热部署开关
      enabled: true

  # redis配置
  redis:
    #模式single或cluster
    mode: single
    # 单机地址
    host: localhost
    # 端口，默认为6379
    port: 6379
    # 集群地址
    cluster:
      nodes:
        - 127.0.0.1:6380
        - 127.0.0.1:6381
        - 127.0.0.1:6382
    # 数据库索引
    database: 0
    # 密码
    password: ENC(6hqYkKsCtdbgY53o7aoxVnZqXOWqWoYQT7ReY+IBkMkKmgQpOt6kHnfJeH/7vvLt)
    # 连接超时时间
    timeout: 10s
    lettuce:
      pool:
        # 连接池中的最小空闲连接
        min-idle: 0
        # 连接池中的最大空闲连接
        max-idle: 8
        # 连接池的最大数据库连接数
        max-active: 8
        # #连接池最大阻塞等待时间（使用负值表示没有限制）
        max-wait: -1ms

# token配置
token:
  # 令牌自定义标识
  header: Authorization
  # 令牌密钥
  secret: abcdefghijklmnopqrstuvwxyz
  # 令牌有效期（默认30分钟）
  expireTime: 30

# MyBatis配置
mybatis:
  # 数据库类型 mysql,kingbase
  configuration:
    database-id: mysql
  # 搜索指定包别名
  typeAliasesPackage: com.ruoyi.**.domain
  # 配置mapper的扫描，找到所有的mapper.xml映射文件
  mapperLocations: classpath*:mapper/**/*Mapper.xml
  # 加载全局的配置文件
  configLocation: classpath:mybatis/mybatis-config.xml

# PageHelper分页插件
pagehelper:
  # helperDialect: mysql
  autoRuntimeDialect: true
  supportMethodsArguments: true
  params: count=countSql

# Swagger配置
swagger:
  # 是否开启swagger
  enabled: false
  # 请求前缀
  pathMapping: /dev-api

# 防止XSS攻击
xss:
  # 过滤开关
  enabled: true
  # 排除链接（多个用逗号分隔）
  excludes: /system/notice
  # 匹配链接
  urlPatterns: /system/*,/monitor/*,/tool/*

# 文件上传
dromara:
  x-file-storage:
    default-platform: minio-1        # 必须和下方 platform 一致
    thumbnail-suffix: ".min.jpg"
    minio:
      - platform: minio-1            # 标识，可自定义
        enable-storage: true
        access-key: utOGh5X1fv7d7Kiwbzm5
        secret-key: ENC(mUx7NTDhdf7uJlIYuBtWtfexPO4agcRErYQRu07ckY9qeulkaE7cv9mRCZlMVyk+xSNxZFD4vdjzP4mOuNWvk0rLhpMSUov40E7elw8hudY=)
        end-point: http://112.86.226.241:9000
        #end-point: http://192.168.0.100:9000
        bucket-name: public
        domain: https://yiti.shunxuan.net.cn:9000/public/   # 直链域名，末尾 /
        base-path:          # 可选虚拟目录

#短信配置
sms:
  # 标注从yml读取配置
  config-type: yaml
  HttpLog: true
  corePoolSize: 2
  maxPoolSize: 6
  queueCapacity: 200
  blends:
    # 自定义的标识configId
    alibaba:
      #框架定义的厂商名称标识
      supplier: alibaba
      #accessKey
      access-key-id:
      #accessSecret
      access-key-secret:
      #短信签名
      signature:
      #模板ID
      template-id:
      # 随机权重，负载均衡的权重值依赖于此，默认为1，如不需要负载均衡可不进行配置
      weight: 1
      #配置标识名称 如果你使用的yml进行配置，则blends下层配置的就是这个，可为空，如果你使用的接口类配置，则需要设置值
      #需要注意的是，不同的配置之间config-id不能重复，否则会发生配置丢失的问题
      config-id: alibaba
      #短信自动重试间隔时间  默认五秒
      retry-interval: 10
      # 短信重试次数，默认0次不重试
      max-retries: 2
aj:
  captcha:
    #滑块目录
    jigsaw: classpath:images/jigsaw
    #背景图
    pic-click: classpath:images/pic-click
    # 缓存local/redis...
    cache-type: redis
    # local缓存的阈值,达到这个值，清除缓存
    cache-number: 1000
    # local定时清除过期缓存(单位秒),设置为0代表不执行
    timing-clear: 180
    # 验证码类型default两种都实例化。
    type: default
    # 右下角水印文字(我的水印)
    water-mark: 苏戒通
    # 校验滑动拼图允许误差偏移量(默认5像素)
    slip-offset: 5
    # aes加密坐标开启或者禁用(true|false)
    aes-status: true
    # 滑动干扰项(0/1/2)
    interference-options: 1
    history-data-clear-enable: true
    # 接口请求次数一分钟限制是否开启 true|false
    req-frequency-limit-enable: true
    # 验证失败5次，get接口锁定
    req-get-lock-limit: 5
    # 验证失败后，锁定时间间隔,s
    req-get-lock-seconds: 60
    # get接口一分钟内请求数限制
    req-get-minute-limit: 30
    # check接口一分钟内请求数限制
    req-check-minute-limit: 60
    # verify接口一分钟内请求数限制
    req-verify-minute-limit: 60

# 短信配置
jssms:
  api:
    url: http://30.1.1.124:7000/smsbus/yhyx/sms/comm/mt/data/sendTempEncryptSms
  third: ytlyxxhpt
  thirdkey: ENC(aiNVlK94X2mVm/FGTteluBWCewyD+5/x0ELmxNJGIqxU0usQda3LiXYiYuPryOvN)
  public-key: ENC()
  templateId: 02446c8f-a901-4322-b018-4213e64e58e5

jasypt:
  encryptor:
    # 核心：高级算法
    algorithm: PBEWITHHMACSHA512ANDAES_256
    # 必须随机初始化向量
    iv-generator-classname: org.jasypt.iv.RandomIvGenerator
    # 盐生成器
    salt-generator-classname: org.jasypt.salt.RandomSaltGenerator
    # 输出格式
    string-output-type: base64
    # 迭代次数（可选，默认 1000）
    key-obtention-iterations: 1000
    # 密钥通过环境变量传入，绝不下文件
    password: ${JASYPT_ENCRYPTOR_PASSWORD}

encrypt:
  ## 开关控制
  enabled: false
  ## 密钥，与前端保持一致
