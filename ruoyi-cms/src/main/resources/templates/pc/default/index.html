
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在 - 404错误</title>
    <style>
        :root {
            --primary-color: #4285f4;
            --hover-color: #3367d6;
        }
        body {
            font-family: 'Segoe UI', 'PingFang SC', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #e4e8eb 100%);
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            color: #333;
        }
        .container {
            max-width: 600px;
            padding: 40px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .error-code {
            font-size: 120px;
            font-weight: 700;
            margin: 0;
            color: var(--primary-color);
            line-height: 1;
        }
        .error-message {
            font-size: 24px;
            margin: 20px 0;
            color: #555;
        }
        .description {
            font-size: 16px;
            color: #777;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        .action-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
        }
        .btn {
            padding: 12px 28px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s;
        }
        .btn-primary {
            background: var(--primary-color);
            color: white;
        }
        .btn-primary:hover {
            background: var(--hover-color);
            transform: translateY(-2px);
        }
        .btn-secondary {
            border: 1px solid #ddd;
            color: #555;
        }
        .btn-secondary:hover {
            background: #f5f5f5;
        }
        .animation {
            position: absolute;
            width: 200px;
            height: 200px;
            background: rgba(66, 133, 244, 0.1);
            border-radius: 50%;
            top: -100px;
            right: -100px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="animation"></div>
    <h1 class="error-code">404</h1>
    <h2 class="error-message">页面未找到</h2>
    <p class="description">
        您访问的页面可能已被删除、暂时不可用或地址输入错误。
        <br>
        请检查URL是否正确，或尝试以下操作：
    </p>
</div>
</body>
</html>
