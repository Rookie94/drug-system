
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>页面不存在</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
        }
        .container {
            max-width: 90%;
            padding: 20px;
        }
        h1 {
            font-size: 5rem;
            margin: 0;
            color: #333;
        }
        p {
            font-size: 1.2rem;
            color: #666;
            margin: 20px 0;
        }
        .btn {
            display: inline-block;
            padding: 12px 24px;
            background: #4285f4;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-weight: bold;
            transition: background 0.3s;
        }
        .btn:hover {
            background: #3367d6;
        }
        .emoji {
            font-size: 3rem;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="emoji">😕</div>
    <h1>404</h1>
    <p>抱歉，您访问的页面不存在或已被移除</p>
    <a href="/" class="btn">返回首页</a>
</div>
</body>
</html>
